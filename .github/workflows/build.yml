name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-java8-build:
    name: Windows Java 8 Gradle build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Show Gradle and Java versions
        shell: pwsh
        run: |
          java -version
          .\gradlew.bat --version

      - name: Build with ForgeGradle
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stand-and-hold-jars
          path: build/libs/*.jar
          if-no-files-found: error
