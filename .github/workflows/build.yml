name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-java25-build:
    name: Windows Java 25 NeoForge build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home/modern

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Show Gradle and Java versions
        shell: pwsh
        run: |
          java --version
          .\gradlew.bat --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify editable art exports
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\export-art.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with ModDevGradle
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: Upload normal mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stand-and-hold-neoforge-26.3
          path: build/libs/standandhold-0.1.0-alpha.1.jar
          if-no-files-found: error
